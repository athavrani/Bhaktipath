name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Align Expo SDK dependencies
        run: npx expo install --fix
      - name: Install expo-audio peer dependency
        run: npx expo install expo-asset
      - name: Refresh dependency installation
        run: npm install --no-audit --no-fund
      - name: Generate app icons
        run: npm run generate:icons
      - name: Expo diagnostics
        run: npx expo-doctor
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  android-release-apk:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Avoid the obsolete SDK package "tools" from the action's defaults.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate app icons
        run: npm run generate:icons
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify release APK exists
        run: test -s android/app/build/outputs/apk/release/app-release.apk
      - name: Upload installable release APK
        uses: actions/upload-artifact@v4
        with:
          name: BhaktiPath-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
