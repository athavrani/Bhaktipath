name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Align Expo SDK dependencies
        run: npx expo install --fix
      - name: Install expo-audio peer dependency
        run: npx expo install expo-asset
      - name: Refresh dependency installation
        run: npm install --no-audit --no-fund
      - name: Expo diagnostics
        run: npx expo-doctor
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  android-debug-apk:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BhaktiPath-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
